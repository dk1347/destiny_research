<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정밀 천문 만세력 | destiny</title>
  <meta name="description" content="출생 지역 경도와 균시차를 반영한 정밀 사주 명리학 계산기">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 16px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 8px; }
    header p { color: var(--muted); font-size: 0.95rem; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .ad-placeholder {
      background: rgba(0,0,0,0.25);
      border: 1px dashed var(--muted);
      border-radius: 8px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--muted); }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { opacity: 0.9; }

    .result-box { display: none; margin-top: 16px; }
    .grid-pillars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      margin-top: 12px;
    }
    .pillar {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .pillar span { display: block; font-size: 0.8rem; color: var(--muted); }
    .pillar strong { font-size: 1.1rem; color: var(--accent); margin-top: 4px; display: block; }

    .lead-box {
      border: 1px solid var(--accent);
      background: rgba(56, 189, 248, 0.05);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .lead-box h3 { font-size: 1.2rem; margin-bottom: 8px; }
    .lead-box p { font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>정밀 천문 만세력 (MVP)</h1>
    <p>한국 표준시(135°E) 오차와 균시차를 정밀 보정합니다</p>
  </header>

  <!-- 상단 애드센스 광고 영역 -->
  <div class="ad-placeholder">구글 애드센스 상단 광고 영역 (디스플레이)</div>

  <!-- 입력 폼 -->
  <div class="card">
    <label for="birthDate">생년월일</label>
    <input type="date" id="birthDate" value="1995-05-15">

    <label for="birthTime">태어난 시간 (기억나는 대로 입력)</label>
    <input type="time" id="birthTime" value="14:30">

    <label for="city">출생 지역 (경도 보정용)</label>
    <select id="city">
      <option value="126.97">서울 / 경기 (동경 126.9° - 약 32분 감산 보정)</option>
      <option value="129.07">부산 / 경남 (동경 129.0° - 약 24분 감산 보정)</option>
      <option value="128.60">대구 / 경북 (동경 128.6° - 약 26분 감산 보정)</option>
      <option value="126.85">광주 / 전라 (동경 126.8° - 약 33분 감산 보정)</option>
      <option value="127.38">대전 / 충청 (동경 127.3° - 약 30분 감산 보정)</option>
    </select>

    <button onclick="calculateSaju()">정밀 사주 기둥 확인하기</button>

    <!-- 사주 결과 노출 박스 -->
    <div class="result-box" id="resultBox">
      <hr style="border: 0; border-top: 1px solid #334155; margin: 16px 0;">
      <p id="correctedTimeText" style="font-size: 0.9rem; color: var(--accent);"></p>
      
      <div class="grid-pillars">
        <div class="pillar"><span>시주(時柱)</span><strong id="siJu">-</strong></div>
        <div class="pillar"><span>일주(日柱)</span><strong id="ilJu">-</strong></div>
        <div class="pillar"><span>월주(月柱)</span><strong id="wolJu">-</strong></div>
        <div class="pillar"><span>년주(年柱)</span><strong id="nyeonJu">-</strong></div>
      </div>
    </div>
  </div>

  <!-- 하단 애드센스 광고 영역 -->
  <div class="ad-placeholder">구글 애드센스 중간 광고 영역</div>

  <!-- 리드 수집 및 유료 리포트 사전예약 폼 -->
  <div class="lead-box">
    <h3>✨ 평생 대운 정밀 분석 리포트 얼리버드</h3>
    <p>본편 런칭 시 50% 할인 쿠폰과 천문 정밀 분석 요약본을 보내드립니다.</p>
    <form id="leadForm" onsubmit="handleLeadSubmit(event)">
      <input type="email" id="email" placeholder="쿠폰을 받을 이메일 주소를 입력하세요" required>
      <button type="submit">사전예약 혜택 받기 (무료)</button>
    </form>
    <p id="leadSuccess" style="color: var(--accent); display: none; margin-top: 10px; font-size: 0.85rem;">
      등록 완료! destiny 런칭 소식과 리포트 혜택을 전해드리겠습니다.
    </p>
  </div>
</div>

<script>
  function calculateSaju() {
    const time = document.getElementById('birthTime').value;
    const city = document.getElementById('city');
    const cityName = city.options[city.selectedIndex].text;

    // MVP 시뮬레이션 결과 표시
    document.getElementById('correctedTimeText').innerText = 
      `보정 완료: ${cityName.split(' ')[0]} 기준 진태양시 적용됨 (${time})`;
    
    // 임시 만세력 결과 (실제 간지 알고리즘 연결 지점)
    document.getElementById('siJu').innerText = "乙未";
    document.getElementById('ilJu').innerText = "甲子";
    document.getElementById('wolJu').innerText = "辛巳";
    document.getElementById('nyeonJu').innerText = "乙亥";

    document.getElementById('resultBox').style.display = 'block';
  }

  function handleLeadSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    if (!email) return;

    // Google Forms, Formspree, 혹은 개인 API로 연결 가능한 지점
    console.log("리드 수집 완료:", email);
    document.getElementById('leadForm').style.display = 'none';
    document.getElementById('leadSuccess').style.display = 'block';
  }
</script>

</body>
</html>
